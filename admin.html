<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Mathew's SmartStudy Library</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="background: #f1f5f9;">

  <!-- Header -->
  <div class="top-header">
    <div class="top-brand" style="margin: 0 auto;">
      <div class="brand-logo-icon">📖</div>
      <div class="brand-text">
        <h2>Mathew's SmartStudy Library</h2>
        <span class="green-badge">Secure Admin Portal</span>
      </div>
    </div>
  </div>

  <div class="container" style="max-width: 600px; margin: 3rem auto;">

    <!-- Admin Log In Box -->
    <section id="adminAuthSection" class="admin-box" style="border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08);">
      <h3 style="color: #0f172a; margin-bottom: 0.4rem; text-align: center;">Admin Log In</h3>
      <p style="color: #64748b; font-size: 0.88rem; margin-bottom: 1.2rem; text-align: center;">Log in using your Admin Username and Password.<br><small style="color:#0d9488; font-weight:600;">Default Username: admin | Password: admin123</small></p>
      
      <form id="adminLoginForm">
        <div class="form-group">
          <label>Username:</label>
          <input type="text" id="adminLoginUsername" placeholder="e.g. admin" required>
        </div>

        <div class="form-group">
          <label>Password:</label>
          <div class="password-wrapper">
            <input type="password" id="adminPasswordInput" placeholder="Enter password" required>
            <button type="button" id="toggleAdminPass" class="toggle-password">👁️</button>
          </div>
        </div>
        <button type="submit" class="primary-btn" style="width: 100%; padding: 0.8rem; background: #ea580c; font-size: 1rem; margin-top: 0.5rem;">Log In to Portal</button>
      </form>
      <p id="adminLoginError" style="color: #ef4444; font-size: 0.88rem; display: none; margin-top: 1rem; text-align: center;"></p>
    </section>

    <!-- Admin Dashboard (Visible After Login) -->
    <section id="adminDashboardSection" class="admin-box" style="display: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 1rem;">
        <div>
          <h3 style="color: #0f172a;">Welcome, Admin!</h3>
          <p style="color: #64748b; font-size: 0.82rem;">Upload files for Past Papers, Notes, or Timetables.</p>
        </div>
        <button id="adminLogoutBtn" class="danger-btn" style="padding: 0.5rem 1rem;">Logout</button>
      </div>

      <!-- Upload Section -->
      <div id="sectionUploadBox">
        <h4 style="margin-bottom: 0.8rem; color: #1e293b;">Upload Real File (PDF/Document)</h4>
        <form id="addResourceForm">
          <div class="form-group">
            <label>Resource Title:</label>
            <input type="text" id="resTitle" placeholder="e.g. G12 Mathematics Paper 1 (2026)" required>
          </div>

          <!-- Section Type (Past Paper, Study Notes, or Timetable) -->
          <div class="form-group">
            <label>Website Section Category:</label>
            <select id="resCategory">
              <option value="past_paper">Past Paper / GCE Pastpaper</option>
              <option value="notes">Study Notes</option>
              <option value="timetable">Exam Timetable</option>
            </select>
          </div>

          <div class="form-group">
            <label>Grade Level:</label>
            <select id="resLevel">
              <option value="senior">Grade 12 (Senior)</option>
              <option value="junior">Grade 9 (Junior)</option>
              <option value="primary">Grade 7 (Primary)</option>
              <option value="gce">GCE</option>
            </select>
          </div>

          <div class="form-group">
            <label>Subject:</label>
            <input type="text" id="resSubject" placeholder="e.g. Mathematics, Bemba, Chemistry" required>
          </div>

          <div class="form-group">
            <label>Year:</label>
            <input type="text" id="resYear" value="2026" required>
          </div>

          <div class="form-group">
            <label>Select PDF File from Local Storage:</label>
            <input type="file" id="resLocalFile" accept=".pdf,.doc,.docx" required style="padding: 0.4rem; background: #f8fafc;">
          </div>
          
          <button type="submit" class="primary-btn" style="width: 100%; padding: 0.75rem; background: #ea580c; font-size: 1rem; margin-top: 0.5rem;">Upload to Live Website</button>
        </form>

        <!-- Manage Uploaded Resources -->
        <div style="margin-top: 2rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; border-top: 1px solid #e2e8f0; padding-top: 1rem;">
            <h4 style="color: #1e293b;">Uploaded Library Files</h4>
            <button id="clearAllExamplesBtn" class="danger-btn" style="padding: 0.35rem 0.7rem; font-size: 0.78rem;">Clear All Files</button>
          </div>
          <div id="adminResourceList" style="display: flex; flex-direction: column; gap: 0.6rem;"></div>
        </div>
      </div>

    </section>

  </div>

  <script src="js/admin.js"></script>
</body>
</html>
