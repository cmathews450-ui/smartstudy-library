<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Mathew's SmartStudy Library</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="top-header">
    <div class="top-brand">
      <div class="brand-logo-icon">📖</div>
      <div class="brand-text">
        <h2>Mathew's SmartStudy Library</h2>
        <span class="green-badge">Admin Portal</span>
      </div>
    </div>
    <div>
      <a href="index.html" class="primary-btn" style="text-decoration:none; padding: 0.5rem 1rem; font-size: 0.85rem;">← Back to Library</a>
    </div>
  </div>

  <div class="container" style="max-width: 500px; margin-top: 3rem;">
    <!-- Admin Login Section -->
    <section id="adminAuthSection" class="admin-box">
      <h3 style="margin-bottom: 0.5rem; color: #0f172a;">Admin Login</h3>
      <p style="color: #64748b; font-size: 0.88rem; margin-bottom: 1.2rem;">Enter your administrator password (default is <code>admin123</code>).</p>
      
      <form id="adminLoginForm">
        <div class="form-group">
          <label>Password:</label>
          <div class="password-wrapper">
            <input type="password" id="adminPasswordInput" placeholder="Enter admin password" required>
            <button type="button" id="toggleAdminPass" class="toggle-password">👁️</button>
          </div>
        </div>
        <button type="submit" class="primary-btn" style="width: 100%; padding: 0.75rem;">Login to Dashboard</button>
      </form>
      <div class="auth-links" style="margin-top: 1rem;">
        <a id="adminForgotPassBtn" style="color: #ea580c; cursor: pointer; font-weight: 600;">Forgot Admin Password?</a>
      </div>
      <p id="adminLoginError" style="color: #ef4444; font-size: 0.85rem; display: none; margin-top: 0.8rem; text-align: center;"></p>
    </section>

    <!-- Admin Dashboard Section -->
    <section id="adminDashboardSection" class="admin-box" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem;">
        <h3 style="color: #0f172a;">Admin Control Panel</h3>
        <button id="adminLogoutBtn" class="danger-btn">Logout</button>
      </div>
      <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem;">Welcome, Admin! You can manage past paper resources below.</p>
      
      <!-- Add Resource Form -->
      <h4 style="margin-bottom: 0.8rem; color: #1e293b;">Upload New Solution / Past Paper</h4>
      <form id="addResourceForm">
        <div class="form-group">
          <label>Resource Title:</label>
          <input type="text" id="resTitle" placeholder="e.g. Grade 12 Mathematics Paper 1 (2026)" required>
        </div>
        <div class="form-group">
          <label>Grade Level:</label>
          <select id="resLevel">
            <option value="senior">Grade 12 (Senior)</option>
            <option value="junior">Grade 9 (Junior)</option>
            <option value="primary">Grade 7 (Primary)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Subject:</label>
          <input type="text" id="resSubject" placeholder="e.g. Mathematics, Biology, Science" required>
        </div>
        <div class="form-group">
          <label>File URL (PDF Link):</label>
          <input type="text" id="resUrl" placeholder="Enter PDF link or file path" required>
        </div>
        <button type="submit" class="primary-btn" style="width: 100%; padding: 0.75rem;">Add Resource</button>
      </form>

      <div style="margin-top: 2rem;">
        <h4 style="margin-bottom: 0.8rem; color: #1e293b;">Existing Resources</h4>
        <div id="adminResourceList" style="display: flex; flex-direction: column; gap: 0.6rem;"></div>
      </div>
    </section>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
